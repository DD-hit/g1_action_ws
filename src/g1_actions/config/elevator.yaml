# Elevator business parameters. Shared driver profile: robot.yaml.
# Units: metres and radians unless stated otherwise.
# Business parameters
# Metres, radians. Camera nominal pose comes from the supplied rubber-hand URDF.
model_file: robot/g1_29dof_mode_15.urdf
base_frame: torso_link
camera:
  color_topic: /camera/camera/color/image_raw
  depth_topic: /camera/camera/aligned_depth_to_color/image_raw
  info_topic: /camera/camera/color/camera_info
  mount_link: d435_link
  use_camera_tf: true
  camera_link_frame: camera_link
  # REP-103 camera_link (+x forward) -> optical (+z forward, +x right, +y down).
  optical_xyz: [0.0, 0.0, 0.0]
  optical_rpy: [-1.5707963267948966, 0.0, -1.5707963267948966]
  # Optional measured replacement T_torso_color_optical. Empty uses URDF nominal pose.
  measured_xyz: null
  measured_rpy: null
  verified: false
  max_sync_skew: 0.05
  max_frame_age: 0.6
  # Matches the default pipeline RELIABLE publisher; retain only the newest image.
  image_reliability: reliable
  # Task admission requires sustained fresh RGB-D; recovery must qualify again.
  ready_stable_s: 2.0
  ready_min_frames: 6
detector:
  backend: tensorrt
  engine: models/elevator_yolov10_960_fp16.engine
  onnx: models/elevator_yolov10.onnx
  native_library: /opt/ele_elevator/lib/libele_trt.so
  imgsz: 960
  confidence: 0.65
  conflict_iou: 0.5
  conflict_margin: 0.20
  stable_frames: 3
  stable_jitter_px: 4.0
  max_rate: 10.0
depth:
  min_m: 0.20
  max_m: 1.5
  min_plane_points: 80
  max_plane_residual_m: 0.006
  max_incidence_deg: 65.0
tools:
  left:
    wrist_link: left_wrist_yaw_link
    hand_link: left_rubber_hand
    # Calculated from the mesh's extreme +x surface, a candidate middle-tip point.
    # Must be verified against the actual rubber hand before physical execution.
    hand_tip_xyz: [0.13174185, -0.03347778, 0.00661192]
    verified: false
  right:
    wrist_link: right_wrist_yaw_link
    hand_link: right_rubber_hand
    hand_tip_xyz: [0.13174105, 0.03348012, 0.00666725]
    verified: false
motion:
  withdraw_release_clearance_m: 0.020
  # After verified linear withdrawal, hand control back without business RETURN.
  return_to_start_after_withdraw: false
  target_y_offset_m: 0.0  # Magnitude in metres; left arm +Y, right arm -Y; 0 disables.
  target_z_offset_m: 0.04  # Fingertip height compensation along torso_link +Z (metres).
  # Capture one stable RGB-D target per task, then pause YOLO inference.
  pause_inference_on_lock: true
  require_business_driver: true
  driver_install_prefix: /workspace/install/brsd_upbody_control
  panel_planning_clearance_m: 0.05  # 10 mm reserve over runtime 40 mm guard.
  button_aperture_half_width_m: 0.020  # Only this button region permits contact.
  approach_m: 0.06
  hover_m: 0.012
  press_depth_by_direction_m: {up: 0.024, down: 0.024}
  max_press_depth_m: 0.035  # Full mesh/aperture checks remain active.
  # Driver scaling factors (0, 1], not m/s or rad/s.
  stage_profiles:
    APPROACH: {speed: 0.45, acceleration: 0.35}
    PRESS: {speed: 0.72, acceleration: 0.54}
    # Cached retraction independently scales PRESS timing; these profiles apply only to planned moves.
    WITHDRAW: {speed: 0.35, acceleration: 0.30}
    RETURN: {speed: 0.15, acceleration: 0.12}
    RECOVERY_WITHDRAW: {speed: 0.35, acceleration: 0.30}
    RECOVERY_RETURN: {speed: 0.15, acceleration: 0.12}
    HOVER_APPROACH: {speed: 0.25, acceleration: 0.15}
    HOVER_RETURN: {speed: 0.25, acceleration: 0.15}
    HEIGHT_MOVE: {speed: 0.25, acceleration: 0.15}
    HEIGHT_RETURN: {speed: 0.25, acceleration: 0.15}
  # Fallback for stages without explicit overrides.
  speed: 0.15
  acceleration: 0.12
  planning_timeout_s: 8.0  # Driver also rejects stale business requests before execution.
  # Separate scaling factors for the non-contact hover trial.
  hover_speed: 0.25
  hover_acceleration: 0.15
  dwell_s: 1.0  # Capped by the shared contact time budget.
  max_target_age_s: 0.8
  command_timeout_s: 120.0  # Includes planning/preflight and low-speed free-space travel.
  contact_timeout_s: 1.0  # Includes endpoint waiting and dwell after entering hover_m.
  contact_position_tolerance_m: 0.005  # Measured normal endpoint tolerance; max penetration remains separate.
  position_tolerance_m: 0.008
  orientation_tolerance_rad: 0.15
  # Target snapshot stays fixed in torso_link; later body motion is not compensated.
  max_joint_speed: 0.08
  workspace_min: [0.08, -0.60, -0.30]
  workspace_max: [0.60, 0.60, 0.65]
  max_reach_m: 0.65

# Down position acquisition: direct YOLO down, or up translated along base_frame Z.
down_target:
  mode: from_up  # direct | from_up; restart the task service after changes.
  z_offset_m: 0.06  # from_up: down.point = up.point - [0, 0, offset].
